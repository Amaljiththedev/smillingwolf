<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#efece4"/>
  <!-- river -->
  <path d="M0 690 C 300 660, 600 720, 900 680 S 1150 660, 1200 670 L1200 800 L0 800 Z" fill="#c6dde8"/>
  <text x="980" y="752" font-size="18" fill="#6a8a99" letter-spacing="4">RIVER</text>
  <!-- railway and station -->
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#8a867c" stroke-width="4"/>
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#efece4" stroke-width="2" stroke-dasharray="10 10"/>
  <rect x="880" y="60" width="130" height="34" rx="3" fill="#d6d1c4" stroke="#a9a397"/>
  <text x="945" y="82" font-size="14" fill="#52514e" text-anchor="middle">STATION</text>
  <!-- streets -->
  <g fill="#ffffff" stroke="#d6d1c4" stroke-width="2">
    <rect x="-5" y="238" width="1210" height="24"/>
    <rect x="368" y="0" width="24" height="700"/>
    <rect x="808" y="96" width="24" height="590"/>
    <rect x="160" y="511" width="920" height="18"/>
  </g>
  <text x="560" y="255" font-size="12" fill="#898781" letter-spacing="3">HIGH STREET</text>
  <text x="385" y="460" font-size="12" fill="#898781" letter-spacing="3" transform="rotate(-90 385 460)">STATION ROAD</text>
  <!-- plots -->
  <g fill="#e4e0d6" stroke="#cfcac0" stroke-width="2">
    <rect x="170" y="110" width="190" height="118"/>
    <rect x="400" y="110" width="400" height="118"/>
    <rect x="840" y="110" width="230" height="118"/>
    <rect x="170" y="272" width="190" height="231"/>
    <rect x="400" y="272" width="400" height="231"/>
    <rect x="840" y="272" width="230" height="231"/>
    <rect x="170" y="537" width="190" height="103"/>
    <rect x="400" y="537" width="400" height="103"/>
    <rect x="840" y="537" width="230" height="103"/>
  </g>
  <!-- the old mill, kept -->
  <rect x="290" y="547" width="60" height="85" fill="#b9a88f" stroke="#8a7a62"/>
  <text x="320" y="595" font-size="10" fill="#fff" text-anchor="middle">MILL</text>
  <!-- site boundary -->
  <rect x="160" y="100" width="920" height="555" fill="none" stroke="#e34948" stroke-width="3" stroke-dasharray="14 8"/>
  <!-- title -->
  <rect x="20" y="700" width="330" height="76" rx="6" fill="#ffffff" stroke="#d6d1c4"/>
  <text x="36" y="728" font-size="16" fill="#111" font-weight="bold">Illustrative masterplan</text>
  <text x="36" y="752" font-size="12" fill="#52514e">Made-up plan for the prototype. Not to scale.</text>
  <line x1="36" y1="764" x2="66" y2="764" stroke="#e34948" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="74" y="768" font-size="11" fill="#52514e">Site boundary</text>
</svg>
